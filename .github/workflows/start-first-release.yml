name: Start first addon release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/start-first-release.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: start-first-addon-release
  cancel-in-progress: false

jobs:
  start:
    if: github.repository == 'Warriorcatzz/virtuous-companion-addon'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.8.5
      RELEASE_COMMIT: 0fd817197aeab92eef5b6f3875cd48b0a9314d26
    steps:
      - name: Create first version tag and start the existing release workflow
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" >/dev/null
          elif [[ "$existing" != "$RELEASE_COMMIT" ]]; then
            echo 'The version tag already points to a different commit; refusing to move it.'
            exit 1
          fi
          # GITHUB_TOKEN tag pushes do not trigger another workflow, so dispatch it explicitly.
          gh workflow run release.yml --repo "$GH_REPO" --ref main -f release_tag="$RELEASE_TAG"
          echo "Started the existing release workflow for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
